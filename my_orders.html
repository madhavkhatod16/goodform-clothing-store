<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Goodform</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <p class="announcement">Free shipping on orders over $75</p>
    <header class="site-header">
      <div class="container header-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new-arrivals">New arrivals</a>
          <a href="index.html#the-edit">The edit</a>
          <a href="my_orders.html" aria-current="page">Orders</a>
        </nav>
        <nav class="account-nav" aria-label="Account and bag">
          <button class="text-button" id="sign-out" type="button">Sign out</button>
          <a class="bag-link" href="cart.html"><span class="bag-icon" aria-hidden="true"></span><span id="bag-count">Bag (0)</span></a>
        </nav>
      </div>
    </header>

    <main class="container inner-page" id="main-content">
      <div class="page-intro">
        <h1>My orders</h1>
        <p class="muted">View delivery status and bills for your orders.</p>
      </div>

      <p class="muted" id="empty-orders" hidden>You haven’t placed an order yet.</p>
      <div id="orders"></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="footer-nav" aria-label="Footer links">
          <a href="index.html#new-arrivals">Shop</a>
          <a href="login.html">Account</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <p>&copy; 2026 Goodform</p>
      </div>
    </footer>

    <template id="order-template">
      <article class="panel order-card">
        <header class="order-heading">
          <div>
            <h2></h2>
            <p class="muted order-date"></p>
          </div>
          <p><span class="status"></span> <strong class="order-total"></strong></p>
        </header>
        <details>
          <summary>View bill</summary>
          <table class="bill-table">
            <thead>
              <tr>
                <th scope="col">Item</th>
                <th scope="col">Qty</th>
                <th scope="col">Price</th>
                <th scope="col">Amount</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <dl class="bill-totals">
            <div>
              <dt>Subtotal</dt>
              <dd class="bill-subtotal">
              </dd>
            </div>
            <div>
              <dt>Shipping</dt>
              <dd class="bill-shipping">
              </dd>
            </div>
            <div class="cart-total">
              <dt>Total</dt>
              <dd class="bill-total">
              </dd>
            </div>
          </dl>
        </details>
      </article>
    </template>

    <script>
      const ordersList = document.getElementById("orders");
      const orderTemplate = document.getElementById("order-template");

      function money(cents) {
        return "$" + (cents / 100).toFixed(2);
      }

      function showOrders() {
        const shop = loadShop();
        let customer = null;
        for (let index = 0; index < shop.customers.length; index++) {
          if (shop.customers[index].email === shop.email) {
            customer = shop.customers[index];
            break;
          }
        }

        if (!customer) {
          alert("Please sign in as a customer to see your orders.");
          window.location.replace("login.html");
          return;
        }

        let count = 0;
        for (let itemIndex = 0; itemIndex < customer.cart.length; itemIndex++) {
          const item = customer.cart[itemIndex];
          count += item.quantity;
        }
        document.getElementById("bag-count").textContent = "Bag (" + count + ")";

        let hasOrders = false;
        ordersList.textContent = "";

        for (let index = shop.orders.length - 1; index >= 0; index--) {
          const order = shop.orders[index];
          if (order.email !== customer.email) {
            continue;
          }

          hasOrders = true;
          const card = orderTemplate.content.cloneNode(true);
          const orderId = "order-" + order.id;
          card.querySelector("article").id = orderId;
          card.querySelector("h2").textContent = "Order #GF-" + order.id;
          card.querySelector(".order-date").textContent = new Date(order.date).toLocaleDateString();
          card.querySelector(".order-total").textContent = money(order.total);

          const status = card.querySelector(".status");
          status.textContent = order.status;
          if (order.status === "Pending") {
            status.classList.add("status-pending");
          }

          const body = card.querySelector("tbody");
          for (let itemIndex = 0; itemIndex < order.items.length; itemIndex++) {
            const item = order.items[itemIndex];
            const row = body.insertRow();
            row.insertCell().textContent = item.name;
            row.insertCell().textContent = item.quantity;
            row.insertCell().textContent = money(item.price);
            row.insertCell().textContent = money(item.price * item.quantity);
          }

          card.querySelector(".bill-subtotal").textContent = money(order.subtotal);
          const shipping = card.querySelector(".bill-shipping");
          if (order.shipping === 0) {
            shipping.textContent = "Free";
          } else {
            shipping.textContent = money(order.shipping);
          }
          card.querySelector(".bill-total").textContent = money(order.total);
          card.querySelector("details").open = window.location.hash === "#" + orderId;
          ordersList.appendChild(card);
        }

        document.getElementById("empty-orders").hidden = hasOrders;
      }

      document.getElementById("sign-out").addEventListener("click", function () {
        const shop = loadShop();
        shop.email = "";
        saveShop(shop);
        window.location.replace("index.html");
      });

      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          showOrders();
        }
      });

      function getShopStorageKey() {
        const plainSave = localStorage.getItem("goodform-shop-plain");
        if (plainSave) {
          return "goodform-shop-plain";
        }

        const saved = localStorage.getItem("goodform-shop-text");
        if (saved && saved.startsWith("shop|")) {
          return "goodform-shop-plain";
        }

        return "goodform-shop-text";
      }

      function loadShop() {
        const shop = { products: null, customers: [], orders: [], email: "" };
        const saved = localStorage.getItem(getShopStorageKey());
        if (!saved) {
          return shop;
        }

        const previousFormat = saved.startsWith("plain-shop|");
        let text = saved;
        let rowSeparator = "\n";
        let fieldSeparator = "|";

        if (!previousFormat) {
          const firstLineEnd = saved.indexOf("\n");
          if (!saved.startsWith("~") || firstLineEnd < 1) {
            return shop;
          }

          const divider = saved.slice(0, firstLineEnd);
          text = saved.slice(firstLineEnd + 1);
          rowSeparator = "\n" + divider + "\n";
          fieldSeparator = "|" + divider + "|";
        }

        let customer;
        let order;

        const lines = text.split(rowSeparator);
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
          const fields = lines[lineIndex].split(fieldSeparator);
          if (previousFormat) {
            for (let fieldIndex = 1; fieldIndex < fields.length; fieldIndex++) {
              let field = fields[fieldIndex];
              field = field.split("%7C").join("|");
              field = field.split("%0D").join("\r");
              field = field.split("%0A").join("\n");
              fields[fieldIndex] = field.split("%25").join("%");
            }
          }

          const type = fields[0];

          if (type === "plain-shop") {
            shop.email = fields[1];
            if (fields[2] === "true") {
              shop.products = [];
            }
          } else if (type === "product") {
            shop.products.push({
              id: fields[1],
              name: fields[2],
              category: fields[3],
              color: fields[4],
              price: Number(fields[5]),
              stock: Number(fields[6]),
              image: fields[7]
            });
          } else if (type === "customer") {
            customer = {
              name: fields[1],
              email: fields[2],
              password: fields[3],
              cart: []
            };
            shop.customers.push(customer);
          } else if (type === "cart") {
            customer.cart.push({ productId: fields[1], quantity: Number(fields[2]) });
          } else if (type === "order") {
            order = {
              id: Number(fields[1]),
              email: fields[2],
              customer: fields[3],
              date: fields[4],
              status: fields[5],
              subtotal: Number(fields[6]),
              shipping: Number(fields[7]),
              total: Number(fields[8]),
              items: []
            };
            shop.orders.push(order);
          } else if (type === "item") {
            order.items.push({
              productId: fields[1],
              name: fields[2],
              price: Number(fields[3]),
              quantity: Number(fields[4])
            });
          }
        }

        return shop;
      }

      function saveShop(shop) {
        const rows = [["plain-shop", shop.email, shop.products !== null]];

        if (shop.products !== null) {
          for (let productIndex = 0; productIndex < shop.products.length; productIndex++) {
            const product = shop.products[productIndex];
            rows.push([
              "product",
              product.id,
              product.name,
              product.category,
              product.color,
              product.price,
              product.stock,
              product.image
            ]);
          }
        }

        for (let customerIndex = 0; customerIndex < shop.customers.length; customerIndex++) {
          const customer = shop.customers[customerIndex];
          rows.push(["customer", customer.name, customer.email, customer.password]);
          for (let itemIndex = 0; itemIndex < customer.cart.length; itemIndex++) {
            const item = customer.cart[itemIndex];
            rows.push(["cart", item.productId, item.quantity]);
          }
        }

        for (let orderIndex = 0; orderIndex < shop.orders.length; orderIndex++) {
          const order = shop.orders[orderIndex];
          rows.push([
            "order",
            order.id,
            order.email,
            order.customer,
            order.date,
            order.status,
            order.subtotal,
            order.shipping,
            order.total
          ]);
          for (let itemIndex = 0; itemIndex < order.items.length; itemIndex++) {
            const item = order.items[itemIndex];
            rows.push(["item", item.productId, item.name, item.price, item.quantity]);
          }
        }

        const values = rows.join("\n");
        let divider = "~";
        while (values.includes(divider)) {
          divider += "~";
        }

        const fieldSeparator = "|" + divider + "|";
        const rowSeparator = "\n" + divider + "\n";
        const lines = [];
        for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
          lines.push(rows[rowIndex].join(fieldSeparator));
        }

        const saved = divider + "\n" + lines.join(rowSeparator);
        localStorage.setItem(getShopStorageKey(), saved);
      }

      showOrders();
    </script>
  </body>
</html>
