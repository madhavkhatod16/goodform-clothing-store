<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | Goodform</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <p class="announcement">Free shipping on orders over $75</p>
    <header class="site-header">
      <div class="container header-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new-arrivals">New arrivals</a>
          <a href="index.html#the-edit">The edit</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <nav class="account-nav" aria-label="Account and bag">
          <button class="text-button" id="sign-out" type="button">Sign out</button>
          <a class="bag-link" href="cart.html" aria-current="page"><span class="bag-icon" aria-hidden="true"></span><span id="bag-count">Bag (0)</span></a>
        </nav>
      </div>
    </header>

    <main class="container inner-page" id="main-content">
      <div class="page-intro">
        <a class="text-link" href="index.html#new-arrivals">Continue shopping</a>
        <h1>Your bag</h1>
        <p class="muted" id="item-count"></p>
      </div>

      <div class="cart-layout">
        <section class="cart-items" id="cart-items" aria-label="Bag items"></section>

        <section class="panel cart-summary" id="cart-summary" aria-labelledby="summary-title" hidden>
          <h2 id="summary-title">Order summary</h2>
          <dl>
            <div>
              <dt>Subtotal</dt>
              <dd id="subtotal">
              </dd>
            </div>
            <div>
              <dt>Shipping</dt>
              <dd id="shipping">
              </dd>
            </div>
            <div class="cart-total">
              <dt>Total</dt>
              <dd id="total">
              </dd>
            </div>
          </dl>
          <button class="button" id="checkout-button" type="button">Place order</button>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="footer-nav" aria-label="Footer links">
          <a href="index.html#new-arrivals">Shop</a>
          <a href="login.html">Account</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <p>&copy; 2026 Goodform</p>
      </div>
    </footer>

    <template id="cart-item-template">
      <article class="cart-item">
        <img width="82" height="100" alt="" hidden>
        <div class="cart-item-info">
          <h2></h2>
          <p class="muted item-color"></p>
          <p class="muted item-stock"></p>
          <form class="line-actions">
            <label>Qty <input type="number" min="1" step="1" required></label>
            <button class="text-button" type="submit">Update</button>
            <button class="text-button remove-item" type="button">Remove</button>
          </form>
        </div>
        <p class="price"></p>
      </article>
    </template>

    <script>
      const shop = readTab();

      const cartItems = document.getElementById("cart-items");
      const itemTemplate = document.getElementById("cart-item-template");

      function calculateBill() {
        const items = [];
        let subtotal = 0;

        for (let index = 0; index < shop.cart.length; index++) {
          const item = shop.cart[index];
          const product = findProduct(item.productId);
          if (product) {
            items.push({ product: product, quantity: item.quantity });
            subtotal += product.price * item.quantity;
          }
        }

        let shipping = 0;
        if (items.length > 0 && subtotal <= 7500) {
          shipping = 500;
        }

        return {
          items: items,
          subtotal: subtotal,
          shipping: shipping,
          total: subtotal + shipping
        };
      }

      function showCart() {
        const email = getCustomerEmail();
        if (!email) {
          return;
        }

        const bill = calculateBill();
        let count = 0;
        cartItems.textContent = "";

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          const product = item.product;
          const row = itemTemplate.content.cloneNode(true);
          const image = row.querySelector("img");
          if (product.image) {
            image.src = product.image;
            image.hidden = false;
          }

          row.querySelector("h2").textContent = product.name;
          row.querySelector(".item-color").textContent = product.color;
          const stockLabel = row.querySelector(".item-stock");
          if (product.stock === 0) {
            stockLabel.textContent = "Out of stock";
          } else {
            stockLabel.textContent = product.stock + " in stock";
          }
          row.querySelector(".price").textContent = money(product.price * item.quantity);

          const input = row.querySelector("input");
          input.value = item.quantity;
          input.max = product.stock;
          input.setAttribute("aria-label", "Quantity for " + product.name);
          input.disabled = product.stock === 0;
          row.querySelector("[type=submit]").disabled = product.stock === 0;

          row.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();
            changeQuantity(product.id, Number(input.value));
          });
          row.querySelector(".remove-item").addEventListener("click", function () {
            changeQuantity(product.id, 0);
          });

          cartItems.appendChild(row);
          count += item.quantity;
        }

        document.getElementById("bag-count").textContent = "Bag (" + count + ")";
        const itemCount = document.getElementById("item-count");
        if (count === 1) {
          itemCount.textContent = "1 item";
        } else {
          itemCount.textContent = count + " items";
        }
        document.getElementById("cart-summary").hidden = count === 0;
        if (count === 0) {
          cartItems.textContent = "Your bag is empty.";
        }

        document.getElementById("subtotal").textContent = money(bill.subtotal);
        const shippingLabel = document.getElementById("shipping");
        if (bill.shipping === 0) {
          shippingLabel.textContent = "Free";
        } else {
          shippingLabel.textContent = money(bill.shipping);
        }
        document.getElementById("total").textContent = money(bill.total);
      }

      function changeQuantity(productId, quantity) {
        const email = getCustomerEmail();
        if (!email) {
          return;
        }

        const cart = shop.cart;
        const product = findProduct(productId);
        if (!product || quantity > product.stock || quantity < 0 || !Number.isInteger(quantity)) {
          alert("That quantity is no longer available.");
          showCart();
          return;
        }

        for (let index = 0; index < cart.length; index++) {
          if (cart[index].productId === productId) {
            if (quantity === 0) {
              cart.splice(index, 1);
            } else {
              cart[index].quantity = quantity;
            }
            saveTab();
            break;
          }
        }
        showCart();
      }

      function placeOrder() {
        const email = getCustomerEmail();
        if (!email) {
          return;
        }

        const cart = shop.cart;
        const bill = calculateBill();
        if (cart.length === 0) {
          alert("Your bag is empty.");
          return;
        }
        if (bill.items.length !== cart.length) {
          alert("Product availability changed. Review your bag.");
          showCart();
          return;
        }

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          if (item.quantity > item.product.stock) {
            alert("Stock has changed. Update your bag before placing the order.");
            showCart();
            return;
          }
        }

        const date = new Date().toISOString();
        const receipt = [email, "", date, "Pending", bill.subtotal, bill.shipping, bill.total];

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          receipt.push(item.product.name, item.product.price, item.quantity);
        }

        const orderId = nextOrderId();
        const orderKey = "goodform-order-" + orderId;
        const orderText = receipt.join("\n");
        try {
          localStorage.setItem(orderKey, orderText);
        } catch (error) {
          alert("The order could not be saved. Your bag is still ready to check out.");
          return;
        }

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          item.product.stock -= item.quantity;
        }

        shop.cart = [];
        saveTab();
        alert("Order placed. Your bill total is " + money(bill.total) + ".");
        window.location.href = "my_orders.html#order-" + orderId;
      }

      function getCustomerEmail() {
        if (!shop.email || shop.email === "store-admin") {
          alert("Please sign in as a customer.");
          window.location.replace("login.html");
          return "";
        }
        return shop.email;
      }

      function findProduct(productId) {
        if (shop.products === null) {
          return null;
        }

        for (let index = 0; index < shop.products.length; index++) {
          const product = shop.products[index];
          if (product.id === productId) {
            return product;
          }
        }
        return null;
      }

      function nextOrderId() {
        let orderId = 1001;
        while (localStorage.getItem("goodform-order-" + orderId)) {
          orderId++;
        }
        return orderId;
      }

      function money(cents) {
        return "$" + (cents / 100).toFixed(2);
      }

      function readTab() {
        const shop = { email: "", products: null, cart: [] };
        const lines = window.name.split("\n");
        const tabName = lines.shift();

        if (tabName !== "goodform-tab") {
          return shop;
        }

        shop.email = lines.shift();
        const productCount = Number(lines.shift());

        if (productCount >= 0) {
          shop.products = [];

          for (let index = 0; index < productCount; index++) {
            const product = {
              id: lines.shift(),
              name: lines.shift(),
              category: lines.shift(),
              color: lines.shift(),
              price: Number(lines.shift()),
              stock: Number(lines.shift()),
              image: lines.shift()
            };
            shop.products.push(product);
          }
        }

        for (let index = 0; index < lines.length; index += 2) {
          const item = {
            productId: lines[index],
            quantity: Number(lines[index + 1])
          };
          shop.cart.push(item);
        }

        return shop;
      }

      function saveTab() {
        let productCount = -1;
        if (shop.products !== null) {
          productCount = shop.products.length;
        }

        const lines = ["goodform-tab", shop.email, productCount];

        for (let index = 0; index < productCount; index++) {
          const product = shop.products[index];
          lines.push(product.id, product.name, product.category, product.color);
          lines.push(product.price, product.stock, product.image);
        }

        for (let index = 0; index < shop.cart.length; index++) {
          const item = shop.cart[index];
          lines.push(item.productId, item.quantity);
        }

        window.name = lines.join("\n");
      }

      document.getElementById("checkout-button").addEventListener("click", placeOrder);
      document.getElementById("sign-out").addEventListener("click", function () {
        shop.email = "";
        shop.cart = [];
        saveTab();
        window.location.replace("index.html");
      });
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
      showCart();
    </script>
  </body>
</html>
