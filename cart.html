<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | Goodform</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <p class="announcement">Free shipping on orders over $75</p>
    <header class="site-header">
      <div class="container header-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new-arrivals">New arrivals</a>
          <a href="index.html#the-edit">The edit</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <nav class="account-nav" aria-label="Account and bag">
          <button class="text-button" id="sign-out" type="button">Sign out</button>
          <a class="bag-link" href="cart.html" aria-current="page"><span class="bag-icon" aria-hidden="true"></span><span id="bag-count">Bag (0)</span></a>
        </nav>
      </div>
    </header>

    <main class="container inner-page" id="main-content">
      <div class="page-intro">
        <a class="text-link" href="index.html#new-arrivals">Continue shopping</a>
        <h1>Your bag</h1>
        <p class="muted" id="item-count"></p>
      </div>

      <div class="cart-layout">
        <section class="cart-items" id="cart-items" aria-label="Bag items"></section>

        <section class="panel cart-summary" id="cart-summary" aria-labelledby="summary-title" hidden>
          <h2 id="summary-title">Order summary</h2>
          <dl>
            <div>
              <dt>Subtotal</dt>
              <dd id="subtotal">
              </dd>
            </div>
            <div>
              <dt>Shipping</dt>
              <dd id="shipping">
              </dd>
            </div>
            <div class="cart-total">
              <dt>Total</dt>
              <dd id="total">
              </dd>
            </div>
          </dl>
          <button class="button" id="checkout-button" type="button">Place order</button>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="footer-nav" aria-label="Footer links">
          <a href="index.html#new-arrivals">Shop</a>
          <a href="login.html">Account</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <p>&copy; 2026 Goodform</p>
      </div>
    </footer>

    <template id="cart-item-template">
      <article class="cart-item">
        <img width="82" height="100" alt="" hidden>
        <div class="cart-item-info">
          <h2></h2>
          <p class="muted item-color"></p>
          <p class="muted item-stock"></p>
          <form class="line-actions">
            <label>Qty <input type="number" min="1" step="1" required></label>
            <button class="text-button" type="submit">Update</button>
            <button class="text-button remove-item" type="button">Remove</button>
          </form>
        </div>
        <p class="price"></p>
      </article>
    </template>

    <script>
      const cartItems = document.getElementById("cart-items");
      const itemTemplate = document.getElementById("cart-item-template");

      const photoLinks = {
        "images/chore-jacket.jpg": "https://images.pexels.com/photos/5079261/pexels-photo-5079261.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=720&h=960",
        "images/everyday-tee.jpg": "https://images.pexels.com/photos/11671964/pexels-photo-11671964.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=720&h=960",
        "images/straight-jean.jpg": "https://images.pexels.com/photos/20279191/pexels-photo-20279191.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=720&h=960",
        "images/linen-shirt.jpg": "https://images.pexels.com/photos/11671275/pexels-photo-11671275.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=720&h=960",
        "images/everyday-collection.jpg": "https://images.pexels.com/photos/31744946/pexels-photo-31744946.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1440&h=960",
        "images/layering-edit.jpg": "https://images.pexels.com/photos/27045933/pexels-photo-27045933.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1440&h=960"
      };

      function getCustomer(shop) {
        for (let customerIndex = 0; customerIndex < shop.customers.length; customerIndex++) {
          const customer = shop.customers[customerIndex];
          if (customer.email === shop.email) {
            return customer;
          }
        }

        alert("Please sign in as a customer to use the shopping bag.");
        window.location.replace("login.html");
        return null;
      }

      function findProduct(products, productId) {
        for (let productIndex = 0; productIndex < products.length; productIndex++) {
          const product = products[productIndex];
          if (product.id === productId) {
            return product;
          }
        }
        return null;
      }

      function money(cents) {
        return "$" + (cents / 100).toFixed(2);
      }

      function makeBill(shop, cart) {
        const items = [];
        let subtotal = 0;

        for (let itemIndex = 0; itemIndex < cart.length; itemIndex++) {
          const item = cart[itemIndex];
          const product = findProduct(shop.products, item.productId);
          if (product) {
            items.push({
              productId: product.id,
              name: product.name,
              price: product.price,
              quantity: item.quantity
            });
            subtotal += product.price * item.quantity;
          }
        }

        let shipping = 0;
        if (items.length > 0 && subtotal <= 7500) {
          shipping = 500;
        }
        return {
          items: items,
          subtotal: subtotal,
          shipping: shipping,
          total: subtotal + shipping
        };
      }

      function showCart() {
        const shop = loadShop();
        const customer = getCustomer(shop);
        if (!customer) {
          return;
        }

        const bill = makeBill(shop, customer.cart);
        let count = 0;
        cartItems.textContent = "";

        for (let itemIndex = 0; itemIndex < bill.items.length; itemIndex++) {
          const item = bill.items[itemIndex];
          const product = findProduct(shop.products, item.productId);
          const row = itemTemplate.content.cloneNode(true);
          let photo = product.image;
          if (photoLinks[photo]) {
            photo = photoLinks[photo];
          }
          if (photo) {
            const image = row.querySelector("img");
            image.setAttribute("src", photo);
            image.hidden = false;
          }
          row.querySelector("h2").textContent = product.name;
          row.querySelector(".item-color").textContent = product.color;
          const stockLabel = row.querySelector(".item-stock");
          if (product.stock === 0) {
            stockLabel.textContent = "Out of stock";
          } else {
            stockLabel.textContent = product.stock + " in stock";
          }
          row.querySelector(".price").textContent = money(item.price * item.quantity);

          const input = row.querySelector("input");
          input.value = item.quantity;
          input.max = product.stock;
          input.setAttribute("aria-label", "Quantity for " + product.name);
          input.disabled = product.stock === 0;
          row.querySelector("[type=submit]").disabled = product.stock === 0;
          row.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();
            changeQuantity(product.id, Number(input.value));
          });
          row.querySelector(".remove-item").addEventListener("click", function () {
            changeQuantity(product.id, 0);
          });

          cartItems.appendChild(row);
          count += item.quantity;
        }

        document.getElementById("bag-count").textContent = "Bag (" + count + ")";
        const itemCount = document.getElementById("item-count");
        if (count === 1) {
          itemCount.textContent = "1 item";
        } else {
          itemCount.textContent = count + " items";
        }
        document.getElementById("cart-summary").hidden = count === 0;
        if (count === 0) {
          cartItems.textContent = "Your bag is empty.";
        }
        document.getElementById("subtotal").textContent = money(bill.subtotal);
        const shipping = document.getElementById("shipping");
        if (bill.shipping === 0) {
          shipping.textContent = "Free";
        } else {
          shipping.textContent = money(bill.shipping);
        }
        document.getElementById("total").textContent = money(bill.total);
      }

      function changeQuantity(productId, quantity) {
        const shop = loadShop();
        const customer = getCustomer(shop);
        if (!customer) {
          return;
        }

        let itemIndex = -1;
        for (let index = 0; index < customer.cart.length; index++) {
          if (customer.cart[index].productId === productId) {
            itemIndex = index;
            break;
          }
        }

        const product = findProduct(shop.products, productId);
        if (itemIndex === -1 || !product || quantity > product.stock || quantity < 0 || !Number.isInteger(quantity)) {
          alert("That quantity is no longer available.");
          showCart();
          return;
        }

        if (quantity === 0) {
          customer.cart.splice(itemIndex, 1);
        } else {
          customer.cart[itemIndex].quantity = quantity;
        }
        saveShop(shop);
        showCart();
      }

      function placeOrder() {
        const shop = loadShop();
        const customer = getCustomer(shop);
        if (!customer) {
          return;
        }

        for (let itemIndex = 0; itemIndex < customer.cart.length; itemIndex++) {
          const item = customer.cart[itemIndex];
          const product = findProduct(shop.products, item.productId);
          if (!product || item.quantity > product.stock) {
            alert("Stock has changed. Update your bag before placing the order.");
            showCart();
            return;
          }
        }

        const bill = makeBill(shop, customer.cart);
        if (bill.items.length === 0) {
          alert("Your bag is empty.");
          showCart();
          return;
        }

        bill.id = 1001 + shop.orders.length;
        bill.email = customer.email;
        bill.customer = customer.name;
        bill.date = new Date().toISOString();
        bill.status = "Pending";
        shop.orders.push(bill);

        for (let itemIndex = 0; itemIndex < bill.items.length; itemIndex++) {
          const item = bill.items[itemIndex];
          const product = findProduct(shop.products, item.productId);
          product.stock -= item.quantity;
        }
        customer.cart = [];
        saveShop(shop);
        alert("Order placed. Your bill total is " + money(bill.total) + ".");
        window.location.href = "my_orders.html#order-" + bill.id;
      }

      document.getElementById("checkout-button").addEventListener("click", placeOrder);

      document.getElementById("sign-out").addEventListener("click", function () {
        const shop = loadShop();
        shop.email = "";
        saveShop(shop);
        window.location.replace("index.html");
      });

      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          showCart();
        }
      });

      function getShopStorageKey() {
        const plainSave = localStorage.getItem("goodform-shop-plain");
        if (plainSave) {
          return "goodform-shop-plain";
        }

        const saved = localStorage.getItem("goodform-shop-text");
        if (saved && saved.startsWith("shop|")) {
          return "goodform-shop-plain";
        }

        return "goodform-shop-text";
      }

      function loadShop() {
        const shop = { products: null, customers: [], orders: [], email: "" };
        const saved = localStorage.getItem(getShopStorageKey());
        if (!saved) {
          return shop;
        }

        const previousFormat = saved.startsWith("plain-shop|");
        let text = saved;
        let rowSeparator = "\n";
        let fieldSeparator = "|";

        if (!previousFormat) {
          const firstLineEnd = saved.indexOf("\n");
          if (!saved.startsWith("~") || firstLineEnd < 1) {
            return shop;
          }

          const divider = saved.slice(0, firstLineEnd);
          text = saved.slice(firstLineEnd + 1);
          rowSeparator = "\n" + divider + "\n";
          fieldSeparator = "|" + divider + "|";
        }

        let customer;
        let order;

        const lines = text.split(rowSeparator);
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
          const fields = lines[lineIndex].split(fieldSeparator);
          if (previousFormat) {
            for (let fieldIndex = 1; fieldIndex < fields.length; fieldIndex++) {
              let field = fields[fieldIndex];
              field = field.split("%7C").join("|");
              field = field.split("%0D").join("\r");
              field = field.split("%0A").join("\n");
              fields[fieldIndex] = field.split("%25").join("%");
            }
          }

          const type = fields[0];

          if (type === "plain-shop") {
            shop.email = fields[1];
            if (fields[2] === "true") {
              shop.products = [];
            }
          } else if (type === "product") {
            shop.products.push({
              id: fields[1],
              name: fields[2],
              category: fields[3],
              color: fields[4],
              price: Number(fields[5]),
              stock: Number(fields[6]),
              image: fields[7]
            });
          } else if (type === "customer") {
            customer = {
              name: fields[1],
              email: fields[2],
              password: fields[3],
              cart: []
            };
            shop.customers.push(customer);
          } else if (type === "cart") {
            customer.cart.push({ productId: fields[1], quantity: Number(fields[2]) });
          } else if (type === "order") {
            order = {
              id: Number(fields[1]),
              email: fields[2],
              customer: fields[3],
              date: fields[4],
              status: fields[5],
              subtotal: Number(fields[6]),
              shipping: Number(fields[7]),
              total: Number(fields[8]),
              items: []
            };
            shop.orders.push(order);
          } else if (type === "item") {
            order.items.push({
              productId: fields[1],
              name: fields[2],
              price: Number(fields[3]),
              quantity: Number(fields[4])
            });
          }
        }

        return shop;
      }

      function saveShop(shop) {
        const rows = [["plain-shop", shop.email, shop.products !== null]];

        if (shop.products !== null) {
          for (let productIndex = 0; productIndex < shop.products.length; productIndex++) {
            const product = shop.products[productIndex];
            rows.push([
              "product",
              product.id,
              product.name,
              product.category,
              product.color,
              product.price,
              product.stock,
              product.image
            ]);
          }
        }

        for (let customerIndex = 0; customerIndex < shop.customers.length; customerIndex++) {
          const customer = shop.customers[customerIndex];
          rows.push(["customer", customer.name, customer.email, customer.password]);
          for (let itemIndex = 0; itemIndex < customer.cart.length; itemIndex++) {
            const item = customer.cart[itemIndex];
            rows.push(["cart", item.productId, item.quantity]);
          }
        }

        for (let orderIndex = 0; orderIndex < shop.orders.length; orderIndex++) {
          const order = shop.orders[orderIndex];
          rows.push([
            "order",
            order.id,
            order.email,
            order.customer,
            order.date,
            order.status,
            order.subtotal,
            order.shipping,
            order.total
          ]);
          for (let itemIndex = 0; itemIndex < order.items.length; itemIndex++) {
            const item = order.items[itemIndex];
            rows.push(["item", item.productId, item.name, item.price, item.quantity]);
          }
        }

        const values = rows.join("\n");
        let divider = "~";
        while (values.includes(divider)) {
          divider += "~";
        }

        const fieldSeparator = "|" + divider + "|";
        const rowSeparator = "\n" + divider + "\n";
        const lines = [];
        for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
          lines.push(rows[rowIndex].join(fieldSeparator));
        }

        const saved = divider + "\n" + lines.join(rowSeparator);
        localStorage.setItem(getShopStorageKey(), saved);
      }

      showCart();
    </script>
  </body>
</html>
