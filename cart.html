<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | Goodform</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <p class="announcement">Free shipping on orders over ₹75</p>
    <header class="site-header">
      <div class="container header-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#new-arrivals">New arrivals</a>
          <a href="index.html#the-edit">The edit</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <nav class="account-nav" aria-label="Account and bag">
          <button class="text-button" id="sign-out" type="button">Sign out</button>
          <a class="bag-link" href="cart.html" aria-current="page"><span class="bag-icon" aria-hidden="true"></span><span id="bag-count">Bag (0)</span></a>
        </nav>
      </div>
    </header>

    <main class="container inner-page" id="main-content">
      <div class="page-intro">
        <a class="text-link" href="index.html#new-arrivals">Continue shopping</a>
        <h1>Your bag</h1>
        <p class="muted" id="item-count"></p>
      </div>

      <p class="muted" id="bag-guest" hidden><a class="text-link" href="index.html#shop-sign-in">Sign in or sign up to use your bag</a></p>
      <div class="cart-layout" id="bag-content">
        <section class="cart-items" id="cart-items" aria-label="Bag items"></section>

        <section class="panel cart-summary" id="cart-summary" aria-labelledby="summary-title" hidden>
          <h2 id="summary-title">Order summary</h2>
          <dl>
            <div>
              <dt>Subtotal</dt>
              <dd id="subtotal">
              </dd>
            </div>
            <div>
              <dt>Shipping</dt>
              <dd id="shipping">
              </dd>
            </div>
            <div class="cart-total">
              <dt>Total</dt>
              <dd id="total">
              </dd>
            </div>
          </dl>
          <button class="button" id="checkout-button" type="button">Place order</button>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="wordmark" href="index.html" aria-label="Goodform home">goodform<span>.</span></a>
        <nav class="footer-nav" aria-label="Footer links">
          <a href="index.html#new-arrivals">Shop</a>
          <a href="login.html">Account</a>
          <a href="my_orders.html">Orders</a>
        </nav>
        <p>&copy; 2026 Goodform</p>
      </div>
    </footer>

    <template id="cart-item-template">
      <article class="cart-item">
        <img width="82" height="100" alt="" hidden>
        <div class="cart-item-info">
          <h2></h2>
          <p class="muted item-color"></p>
          <p class="muted item-size" hidden></p>
          <p class="muted item-stock"></p>
          <form class="line-actions">
            <label>Qty <input type="number" min="1" step="1" required></label>
            <button class="text-button" type="submit">Update</button>
            <button class="text-button remove-item" type="button">Remove</button>
          </form>
        </div>
        <div class="cart-item-prices">
          <del class="original-price" hidden></del>
          <p class="price"></p>
        </div>
      </article>
    </template>

    <script>
      let shop = readTab();

      const cartItems = document.getElementById("cart-items");
      const itemTemplate = document.getElementById("cart-item-template");

      function calculateBill() {
        const items = [];
        let subtotal = 0;

        for (let index = 0; index < shop.cart.length; index++) {
          const item = shop.cart[index];
          const product = findProduct(item.productId);
          if (product) {
            const price = salePrice(product);
            items.push({ product: product, size: item.size, price: price, quantity: item.quantity });
            subtotal += price * item.quantity;
          }
        }

        let shipping = 0;
        if (items.length > 0 && subtotal <= 7500) {
          shipping = 500;
        }

        return {
          items: items,
          subtotal: subtotal,
          shipping: shipping,
          total: subtotal + shipping
        };
      }

      function showCart() {
        const email = getCustomerEmail();
        document.getElementById("bag-guest").hidden = email !== "";
        document.getElementById("bag-content").hidden = !email;
        if (!email) {
          document.getElementById("item-count").textContent = "";
          document.getElementById("bag-count").textContent = "Bag (0)";
          return;
        }

        loadProducts();
        removeDeletedCartItems();
        const bill = calculateBill();
        let count = 0;
        cartItems.textContent = "";

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          const product = item.product;
          const row = itemTemplate.content.cloneNode(true);
          const image = row.querySelector("img");
          if (product.image) {
            image.src = product.image;
            image.hidden = false;
          }

          row.querySelector("h2").textContent = product.name;
          row.querySelector(".item-color").textContent = product.color;
          if (item.size) {
            const sizeLabel = row.querySelector(".item-size");
            sizeLabel.textContent = "Size " + item.size;
            sizeLabel.hidden = false;
          }
          const stockLabel = row.querySelector(".item-stock");
          if (product.stock === 0) {
            stockLabel.textContent = "Out of stock";
          } else {
            stockLabel.textContent = product.stock + " in stock";
          }
          row.querySelector(".price").textContent = money(item.price * item.quantity);
          if (item.price < product.price) {
            const originalPrice = row.querySelector(".original-price");
            originalPrice.textContent = money(product.price * item.quantity);
            originalPrice.hidden = false;
          }

          const input = row.querySelector("input");
          const stockForSize = product.stock - quantityInBag(product.id) + item.quantity;
          input.value = item.quantity;
          input.max = stockForSize;
          input.setAttribute("aria-label", "Quantity for " + product.name);
          input.disabled = stockForSize < 1;
          row.querySelector("[type=submit]").disabled = stockForSize < 1;

          row.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();
            changeQuantity(product.id, item.size, Number(input.value));
          });
          row.querySelector(".remove-item").addEventListener("click", function () {
            changeQuantity(product.id, item.size, 0);
          });

          cartItems.appendChild(row);
          count += item.quantity;
        }

        document.getElementById("bag-count").textContent = "Bag (" + count + ")";
        const itemCount = document.getElementById("item-count");
        if (count === 1) {
          itemCount.textContent = "1 item";
        } else {
          itemCount.textContent = count + " items";
        }
        document.getElementById("cart-summary").hidden = count === 0;
        if (count === 0) {
          cartItems.textContent = "Your bag is empty.";
        }

        document.getElementById("subtotal").textContent = money(bill.subtotal);
        const shippingLabel = document.getElementById("shipping");
        if (bill.shipping === 0) {
          shippingLabel.textContent = "Free";
        } else {
          shippingLabel.textContent = money(bill.shipping);
        }
        document.getElementById("total").textContent = money(bill.total);
      }

      function changeQuantity(productId, size, quantity) {
        const email = getCustomerEmail();
        if (!email) {
          return;
        }

        loadProducts();
        const cart = shop.cart;
        const product = findProduct(productId);
        if (!product || quantity < 0 || !Number.isInteger(quantity)) {
          alert("That quantity is no longer available.");
          showCart();
          return;
        }

        for (let index = 0; index < cart.length; index++) {
          const item = cart[index];
          if (item.productId === productId && item.size === size) {
            const totalQuantity = quantityInBag(productId) - item.quantity + quantity;
            if (quantity === 0) {
              cart.splice(index, 1);
            } else if (totalQuantity > product.stock) {
              alert("That quantity is no longer available.");
              showCart();
              return;
            } else {
              item.quantity = quantity;
            }
            saveTab();
            break;
          }
        }
        showCart();
      }

      function placeOrder() {
        const email = getCustomerEmail();
        if (!email) {
          return;
        }

        loadProducts();
        const cart = shop.cart;
        const bill = calculateBill();
        if (cart.length === 0) {
          alert("Your bag is empty.");
          return;
        }
        if (bill.items.length !== cart.length) {
          alert("Product availability changed. Review your bag.");
          showCart();
          return;
        }

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          if (quantityInBag(item.product.id) > item.product.stock) {
            alert("Stock has changed. Update your bag before placing the order.");
            showCart();
            return;
          }
        }

        const order = {
          email: email,
          customerName: "",
          date: new Date().toISOString(),
          status: "Pending",
          subtotal: bill.subtotal,
          shipping: bill.shipping,
          total: bill.total,
          items: []
        };

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          order.items.push({
            name: item.product.name,
            size: item.size,
            price: item.price,
            quantity: item.quantity
          });
        }

        const orderId = nextOrderId();
        const orderKey = "goodform-order-" + orderId;
        const orderText = JSON.stringify(order);
        try {
          const savedProducts = localStorage.getItem("goodform-products");
          if (!savedProducts || !savedProducts.startsWith("[")) {
            saveProducts();
          }
          localStorage.setItem(orderKey, orderText);
        } catch (error) {
          alert("The order could not be saved. Your bag is still ready to check out.");
          return;
        }

        for (let index = 0; index < bill.items.length; index++) {
          const item = bill.items[index];
          item.product.stock -= item.quantity;
        }

        saveProducts();
        shop.cart = [];
        saveTab();
        alert("Order placed. Your bill total is " + money(bill.total) + ".");
        window.location.href = "my_orders.html#order-" + orderId;
      }

      function getCustomerEmail() {
        if (!shop.email || shop.email === "store-admin") {
          return "";
        }
        return shop.email;
      }

      function quantityInBag(productId) {
        let count = 0;
        for (let index = 0; index < shop.cart.length; index++) {
          const item = shop.cart[index];
          if (item.productId === productId) {
            count += item.quantity;
          }
        }
        return count;
      }

      function salePrice(product) {
        let discount = 0;
        if (product.discount) {
          discount = product.discount;
        }
        return Math.round(product.price * (100 - discount) / 100);
      }

      function findProduct(productId) {
        if (shop.products === null) {
          return null;
        }

        for (let index = 0; index < shop.products.length; index++) {
          const product = shop.products[index];
          if (product.id === productId) {
            return product;
          }
        }
        return null;
      }

      function nextOrderId() {
        let orderId = 1001;
        while (localStorage.getItem("goodform-order-" + orderId)) {
          orderId++;
        }
        return orderId;
      }

      function money(paise) {
        return "₹" + (paise / 100).toFixed(2);
      }

      function readProducts(lines, productCount) {
        const products = [];
        for (let index = 0; index < productCount; index++) {
          const product = {
            id: lines.shift(),
            name: lines.shift(),
            category: lines.shift(),
            color: lines.shift(),
            price: Number(lines.shift()),
            stock: Number(lines.shift()),
            image: lines.shift()
          };
          products.push(product);
        }
        return products;
      }

      function loadProducts() {
        const saved = localStorage.getItem("goodform-products");
        if (saved === null) {
          return;
        }

        if (saved.startsWith("[")) {
          shop.products = JSON.parse(saved);
          return;
        }

        shop.products = [];
        if (saved !== "") {
          const lines = saved.split("\n");
          const productCount = lines.length / 7;
          shop.products = readProducts(lines, productCount);
        }
      }

      function saveProducts() {
        const saved = JSON.stringify(shop.products);
        localStorage.setItem("goodform-products", saved);
      }

      function removeDeletedCartItems() {
        if (shop.products === null) {
          return;
        }

        let removed = false;
        for (let index = shop.cart.length - 1; index >= 0; index--) {
          const item = shop.cart[index];
          const product = findProduct(item.productId);
          if (!product) {
            shop.cart.splice(index, 1);
            removed = true;
          }
        }
        if (removed) {
          saveTab();
        }
      }

      function readTab() {
        const shop = { email: "", products: null, cart: [] };
        const lines = window.name.split("\n");
        const tabName = lines.shift();

        if (tabName !== "goodform-tab") {
          return shop;
        }

        if (lines.length === 1 && lines[0].startsWith("{")) {
          return JSON.parse(lines[0]);
        }

        shop.email = lines.shift();
        const productCount = Number(lines.shift());

        if (productCount >= 0) {
          shop.products = readProducts(lines, productCount);
        }

        for (let index = 0; index < lines.length; index += 2) {
          const item = {
            productId: lines[index],
            quantity: Number(lines[index + 1])
          };
          shop.cart.push(item);
        }

        return shop;
      }

      function saveTab() {
        const tab = {
          email: shop.email,
          products: null,
          cart: shop.cart
        };

        if (localStorage.getItem("goodform-products") === null) {
          tab.products = shop.products;
        }

        window.name = "goodform-tab\n" + JSON.stringify(tab);
      }

      document.getElementById("checkout-button").addEventListener("click", placeOrder);
      document.getElementById("sign-out").addEventListener("click", function () {
        shop.email = "";
        shop.cart = [];
        saveTab();
        window.location.replace("index.html");
      });
      window.addEventListener("storage", function (event) {
        if (event.key === "goodform-products") {
          showCart();
        }
      });
      window.addEventListener("pageshow", function () {
        shop = readTab();
        showCart();
      });
      showCart();
    </script>
  </body>
</html>
